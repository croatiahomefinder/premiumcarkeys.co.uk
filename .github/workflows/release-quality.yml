name: Premium Car Keys release quality gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pck-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-quality:
    name: Preserve critical site functionality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check structure, routes and enquiry links
        run: python -m unittest discover -s tests -v
      - name: Scan website
        run: python scripts/release_gate.py --report /tmp/pck-gate-report.json
      - name: Store gate report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pck-static-gate
          path: /tmp/pck-gate-report.json
